name: Native package validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-package-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Signed Windows x64 package
    runs-on: windows-2025
    environment: release-signing
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare protected Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX) { throw 'WINDOWS_CERTIFICATE_PFX is required.' }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'WINDOWS_CERTIFICATE_PASSWORD is required.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'mineradio-authenticode.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV
      - name: Build and sign Windows x64 package
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: https://timestamp.digicert.com
        run: npm run build:win
      - name: Verify Windows architecture and Authenticode
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('dist/win-unpacked/Mineradio.exe')
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw 'Mineradio.exe is not an x64 executable.'
          }
          $installers = @(Get-ChildItem 'dist/Mineradio-*-Setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK x64 signtool.exe was not found.' }
          & $signTool.FullName verify /pa /all 'dist/win-unpacked/Mineradio.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Main executable Authenticode verification failed.' }
          & $signTool.FullName verify /pa /all $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer Authenticode verification failed.' }
      - name: Remove Authenticode certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_PATH -and (Test-Path $env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_PATH -Force
          }
      - name: Upload Windows validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mineradio-Windows-x64-${{ github.sha }}
          path: dist/Mineradio-*-Setup.exe
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: Signed and notarized macOS arm64 package
    runs-on: macos-15
    environment: release-signing
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Prepare protected signing credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_P8"
          certificate_path="$RUNNER_TEMP/mineradio-developer-id.p12"
          api_key_path="$RUNNER_TEMP/mineradio-notary-api-key.p8"
          keychain_path="$RUNNER_TEMP/mineradio-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | openssl base64 -d -A > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "MINERADIO_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "MINERADIO_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "MINERADIO_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize Apple Silicon DMG
        shell: bash
        env:
          CSC_LINK: ${{ runner.temp }}/mineradio-developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/mineradio-notary-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build:mac
      - name: Smoke packaged macOS application with isolated data
        shell: bash
        run: npm run test:smoke:macos:package
      - name: Validate DMG architecture, contents, signature, and ticket
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(dist-macos/Mineradio-*-macOS-arm64.dmg)
          test "${#artifacts[@]}" -eq 1
          node build/macos/validate-dmg.js "${artifacts[0]}"
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${MINERADIO_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MINERADIO_KEYCHAIN_PATH" 2>/dev/null || true
          fi
          if [[ -n "${MINERADIO_CERTIFICATE_PATH:-}" ]]; then rm -f "$MINERADIO_CERTIFICATE_PATH"; fi
          if [[ -n "${MINERADIO_API_KEY_PATH:-}" ]]; then rm -f "$MINERADIO_API_KEY_PATH"; fi
      - name: Upload macOS validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mineradio-macOS-arm64-${{ github.sha }}
          path: dist-macos/Mineradio-*-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 7
